name: asset studio check

on:
  push:
    branches: [main]
    paths:
      - "asset-studio.js"
      - "person-profile-ui.mjs"
      - "supabase/functions/signal-layer/person-research.ts"
      - "tests/person-research.test.mjs"
      - "asset-budget-ui.mjs"
      - "supabase/functions/signal-layer/asset-budget.ts"
      - "tests/asset-budget.test.mjs"
      - "draft-usage.mjs"
      - "supabase/functions/signal-layer/asset-usage.ts"
      - "tests/draft-usage.test.mjs"
      - "tests/pricing-ledger.test.mjs"
      - "asset-freiform.js"
      - "tests/asset-freiform.test.mjs"
      - "asset-templates.js"
      - "memo-template.js"
      - "roots-logo.mjs"
      - "memo-image-identity.mjs"
      - "tests/memo-image-identity.test.mjs"
      - "memo-example.js"
      - "memo-guides.mjs"
      - "tools/check-memo-browser.mjs"
      - "app.js"
      - "fehler-klartext.mjs"
      - "index.html"
      - "supabase/functions/signal-layer/asset-studio.ts"
      - "supabase/functions/signal-layer/index.ts"
      - "tests/asset-studio.test.mjs"
      - "manual-signal.js"
      - "linkedin-guides.mjs"
      - "tests/linkedin-guides.test.mjs"
      - "tests/deepseek-tarif.test.mjs"
      - "supabase/functions/signal-layer/pipeline-simple.ts"
      - "supabase/functions/signal-layer/manual-signal.ts"
      - "tests/manual-signal.test.mjs"
      - "supabase/functions/signal-layer/source-extract.ts"
      - "tests/source-extract.test.mjs"
      - "supabase/functions/signal-layer/paywall.ts"
      - "supabase/migrations/20260930150000_paywall_erkennung.sql"
      - "tests/paywall.test.mjs"
      - "supabase/functions/signal-layer/extraction-helpers.ts"
      - "tests/article-extraction.test.mjs"
      - "paywall-pill.mjs"
      - ".github/workflows/asset-studio-check.yml"
  pull_request:
    paths:
      - "asset-studio.js"
      - "person-profile-ui.mjs"
      - "supabase/functions/signal-layer/person-research.ts"
      - "tests/person-research.test.mjs"
      - "asset-budget-ui.mjs"
      - "supabase/functions/signal-layer/asset-budget.ts"
      - "tests/asset-budget.test.mjs"
      - "draft-usage.mjs"
      - "supabase/functions/signal-layer/asset-usage.ts"
      - "tests/draft-usage.test.mjs"
      - "tests/pricing-ledger.test.mjs"
      - "asset-freiform.js"
      - "tests/asset-freiform.test.mjs"
      - "asset-templates.js"
      - "memo-template.js"
      - "roots-logo.mjs"
      - "memo-image-identity.mjs"
      - "tests/memo-image-identity.test.mjs"
      - "memo-example.js"
      - "memo-guides.mjs"
      - "tools/check-memo-browser.mjs"
      - "app.js"
      - "fehler-klartext.mjs"
      - "index.html"
      - "supabase/functions/signal-layer/asset-studio.ts"
      - "supabase/functions/signal-layer/index.ts"
      - "tests/asset-studio.test.mjs"
      - "manual-signal.js"
      - "linkedin-guides.mjs"
      - "tests/linkedin-guides.test.mjs"
      - "tests/deepseek-tarif.test.mjs"
      - "supabase/functions/signal-layer/pipeline-simple.ts"
      - "supabase/functions/signal-layer/manual-signal.ts"
      - "tests/manual-signal.test.mjs"
      - "supabase/functions/signal-layer/source-extract.ts"
      - "tests/source-extract.test.mjs"
      - "supabase/functions/signal-layer/paywall.ts"
      - "supabase/migrations/20260930150000_paywall_erkennung.sql"
      - "tests/paywall.test.mjs"
      - "supabase/functions/signal-layer/extraction-helpers.ts"
      - "tests/article-extraction.test.mjs"
      - "paywall-pill.mjs"
      - ".github/workflows/asset-studio-check.yml"

permissions:
  contents: read

jobs:
  asset-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check studio syntax
        run: |
          node --check asset-studio.js
          node --check draft-usage.mjs
          node --check asset-freiform.js
          node --check fehler-klartext.mjs
          node --check asset-templates.js
          node --check memo-template.js
          node --check memo-example.js
          node --check memo-guides.mjs
          node --check tools/check-memo-browser.mjs
          node --check manual-signal.js
          node --check linkedin-guides.mjs
      - name: Test asset studio
        run: node --experimental-strip-types --test tests/memo-image-identity.test.mjs tests/simple-v21.test.mjs tests/person-research.test.mjs tests/asset-budget.test.mjs tests/draft-usage.test.mjs tests/pricing-ledger.test.mjs tests/asset-studio.test.mjs tests/asset-freiform.test.mjs tests/manual-signal.test.mjs tests/linkedin-guides.test.mjs tests/deepseek-tarif.test.mjs tests/source-extract.test.mjs tests/paywall.test.mjs tests/article-extraction.test.mjs
