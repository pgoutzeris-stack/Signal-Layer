name: guard login and recruiting

# Externer Waechter. Er prueft von ausserhalb Supabase, ob Anmeldung und
# Recruiting antworten, und pausiert die schwere Signal-Layer-Arbeit, sobald sie
# es nicht mehr tun. Bewusst hier und nicht als pg_cron-Job: am 3.8.2026 kamen
# die geplanten Jobs in der Datenbank selbst nicht mehr zum Start, genau als ein
# Waechter gebraucht wurde.
#
# Ein 5xx oder eine Zeitueberschreitung gilt als Ausfall. Ein 400 oder 401 ist
# ausdruecklich in Ordnung: es beweist, dass der Dienst antwortet und nur die
# Testdaten ablehnt.
#
# Bei einem schlechten Messwert wird einmal nachgefasst, bevor pausiert wird.
# Der Waechter haelt die Datenbank mit seinen Laeufen selbst warm; faellt ein
# geplanter Lauf bei GitHub aus, kuehlt sie ab, und der naechste Lauf misst dann
# die Aufwaermzeit statt eines Ausfalls. Ein echter Ausfall scheitert beide Male.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-login
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PROJECT_URL: https://csmguwcvzreefluhahyu.supabase.co
      MAX_MS: "3000"
    steps:
      - name: Probe login and recruiting
        id: probe
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${ANON_KEY}" ]; then
            echo "::error::SUPABASE_ANON_KEY is not configured, so the guard cannot probe."
            exit 1
          fi

          probe() {
            # $1 label, $2 curl args...; prints "<label> <http_code> <ms>"
            local label="$1"; shift
            local out
            out=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 20 "$@" || echo "000 20")
            local code="${out%% *}" secs="${out##* }"
            local ms
            ms=$(awk -v s="$secs" 'BEGIN{printf "%d", s*1000}')
            echo "$label $code $ms"
          }

          schlecht() {
            # $1 http_code, $2 ms
            [ "$1" = "000" ] && return 0
            [ "$1" -ge 500 ] 2>/dev/null && return 0
            [ "$2" -gt "${MAX_MS}" ] && return 0
            return 1
          }

          zweimal() {
            # Nachfassen statt sofort Alarm: nach einer Pause in den geplanten
            # Laeufen ist die Datenbank kalt, und dann misst nur der erste
            # Versuch die Aufwaermzeit. Ein echter Ausfall scheitert beide Male.
            # Druckt "<label> <code> <ms> <nachgefasst 0|1> <erster_ms|->".
            local args=("$@")
            local erst zweit erster_ms
            erst=$(probe "${args[@]}")
            set -- $erst
            if ! schlecht "$2" "$3"; then
              echo "$erst 0 -"
              return
            fi
            erster_ms="$3"
            sleep 3
            zweit=$(probe "${args[@]}")
            set -- $zweit
            echo "$1 $2 $3 1 ${erster_ms}"
          }

          login=$(zweimal login -X POST \
            -H "apikey: ${ANON_KEY}" -H "Content-Type: application/json" \
            -d '{"email":"guard-probe@example.invalid","password":"not-a-real-password"}' \
            "${PROJECT_URL}/auth/v1/token?grant_type=password")

          # Echte Recruiting-Tabelle, nicht ersatzweise profiles: nur so deckt der
          # Waechter auch einen Ausfall ab, der allein das Recruiting-Tool trifft.
          recruiting=$(zweimal recruiting -I \
            -H "apikey: ${ANON_KEY}" -H "Accept-Profile: recruiting" \
            "${PROJECT_URL}/rest/v1/applicants?select=id&limit=1")

          profiles=$(zweimal profiles -I \
            -H "apikey: ${ANON_KEY}" \
            "${PROJECT_URL}/rest/v1/profiles?select=id&limit=1")

          echo "$login"
          echo "$recruiting"
          echo "$profiles"

          # Messwerte weiterreichen. GitHub loescht dieses Protokoll nach wenigen
          # Tagen, deshalb landen sie zusaetzlich in shared.ops_probes.
          nachgefasst=0
          for line in "$login" "$recruiting" "$profiles"; do
            set -- $line
            echo "$1_status=$2" >> "$GITHUB_OUTPUT"
            echo "$1_ms=$3" >> "$GITHUB_OUTPUT"
            if [ "${4:-0}" = "1" ]; then
              nachgefasst=1
              echo "$1_first_ms=${5:--}" >> "$GITHUB_OUTPUT"
              echo "Nachgefasst bei $1: erster Versuch ${5} ms, zweiter $3 ms."
            fi
          done
          echo "retried=$nachgefasst" >> "$GITHUB_OUTPUT"

          failed=""
          for line in "$login" "$recruiting" "$profiles"; do
            set -- $line
            label="$1"; code="$2"; ms="$3"
            # 000 = keine Antwort, 5xx = Dienst kaputt, langsam = ueberlastet.
            if [ "$code" = "000" ] || [ "$code" -ge 500 ] 2>/dev/null; then
              failed="${failed}${label} antwortete mit ${code}. "
            elif [ "$ms" -gt "${MAX_MS}" ]; then
              failed="${failed}${label} brauchte ${ms} ms. "
            fi
          done

          if [ -n "$failed" ]; then
            echo "verdict=down" >> "$GITHUB_OUTPUT"
            echo "reason=$failed" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=up" >> "$GITHUB_OUTPUT"
          fi

      - name: Pause heavy work
        if: steps.probe.outputs.verdict == 'down'
        env:
          WORKER_SECRET: ${{ secrets.CRAWLER_WORKER_SECRET }}
          REASON: ${{ steps.probe.outputs.reason }}
          PROBE: ${{ toJSON(steps.probe.outputs) }}
        run: |
          set -uo pipefail
          if [ -z "${WORKER_SECRET}" ]; then
            echo "::error::CRAWLER_WORKER_SECRET is not configured, so heavy work cannot be paused."
            exit 1
          fi
          curl -s --max-time 25 -X POST "${PROJECT_URL}/functions/v1/signal-layer" \
            -H "Content-Type: application/json" -H "authorization: Bearer ${WORKER_SECRET}" \
            -d "$(REASON="${REASON}" PROBE="${PROBE}" python3 -c 'import json,os; print(json.dumps({"action":"set_ops_guard","enabled":False,"reason":"Waechter: "+os.environ["REASON"],"probe":json.loads(os.environ["PROBE"])}))')"
          echo
          echo "::error::Login or recruiting is failing: ${REASON} Heavy Signal Layer work is paused."
          exit 1

      - name: Release heavy work
        if: steps.probe.outputs.verdict == 'up'
        env:
          WORKER_SECRET: ${{ secrets.CRAWLER_WORKER_SECRET }}
          PROBE: ${{ toJSON(steps.probe.outputs) }}
        run: |
          set -uo pipefail
          if [ -z "${WORKER_SECRET}" ]; then
            echo "::error::CRAWLER_WORKER_SECRET is not configured, so heavy work cannot be released."
            exit 1
          fi
          # Idempotent: gibt die Arbeit frei, sobald beide Dienste zwei Laeufe
          # hintereinander gesund sind. Ein einzelner gesunder Lauf genuegt,
          # weil der naechste Ausfall sofort wieder pausiert.
          curl -s --max-time 25 -X POST "${PROJECT_URL}/functions/v1/signal-layer" \
            -H "Content-Type: application/json" -H "authorization: Bearer ${WORKER_SECRET}" \
            -d "$(PROBE="${PROBE}" python3 -c 'import json,os; print(json.dumps({"action":"set_ops_guard","enabled":True,"probe":json.loads(os.environ["PROBE"])}))')"
          echo
