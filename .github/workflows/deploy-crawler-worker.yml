name: deploy crawler worker

on:
  push:
    branches: [main]
    paths:
      - "crawler-worker/**"
      - ".github/workflows/deploy-crawler-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.ENABLE_CRAWLER_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master vom 3.8.2026
      - run: flyctl deploy --remote-only
        working-directory: crawler-worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
