name: deploy signal layer function

# Deploys the signal-layer edge function whenever its source changes. The
# function authenticates every request itself (user JWT, cron secret or
# service-role bearer), so it stays deployed with --no-verify-jwt, exactly as
# before. Needs the repository secret SUPABASE_ACCESS_TOKEN; without it the job
# skips instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/signal-layer/**"
      - ".github/workflows/deploy-signal-layer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-layer-function-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy signal-layer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured - skipping deploy."
            exit 0
          fi
          supabase functions deploy signal-layer \
            --project-ref csmguwcvzreefluhahyu \
            --no-verify-jwt
