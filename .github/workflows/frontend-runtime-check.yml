name: frontend runtime check

on:
  push:
    branches: [main]
    paths:
      - "person-profile-ui.mjs"
      - "app.js"
      - "dropdown-search.mjs"
      - "tests/dropdown-search.test.mjs"
      - "fehler-klartext.mjs"
      - "paywall-pill.mjs"
      - "simple-mode.js"
      - "status-state.mjs"
      - "simple-view-state.mjs"
      - "index.html"
      - "tests/frontend-status.test.mjs"
      - "tests/frontend-simple-view.test.mjs"
      - ".github/workflows/frontend-runtime-check.yml"
  pull_request:
    paths:
      - "person-profile-ui.mjs"
      - "app.js"
      - "dropdown-search.mjs"
      - "tests/dropdown-search.test.mjs"
      - "fehler-klartext.mjs"
      - "paywall-pill.mjs"
      - "simple-mode.js"
      - "status-state.mjs"
      - "simple-view-state.mjs"
      - "index.html"
      - "tests/frontend-status.test.mjs"
      - "tests/frontend-simple-view.test.mjs"
      - ".github/workflows/frontend-runtime-check.yml"

permissions:
  contents: read

jobs:
  frontend-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check person-profile-ui.mjs
          node --check app.js
          node --check dropdown-search.mjs
          node --check fehler-klartext.mjs
          node --check paywall-pill.mjs
          node --check simple-mode.js
          node --check status-state.mjs
          node --check simple-view-state.mjs
          node --input-type=module -e "import('./simple-mode.js')"
      - name: Test startup status states
        run: node --test tests/frontend-status.test.mjs tests/frontend-simple-view.test.mjs tests/dropdown-search.test.mjs
