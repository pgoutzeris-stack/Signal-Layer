<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fragebogen Harness</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head>
<body><button id="li">LinkedIn</button> <button id="me">Ansprache</button> <button id="ms">Manuelles Signal</button>
<script type="module">
import { openAssetStudio, closeAssetStudio } from "./asset-studio.js?v=20260929-13";
import { openManualSignal } from "./manual-signal.js?v=20260929-13";
import { MEMO_EXAMPLE } from "./memo-example.js";
// Ein fertiges Memo fuer den Bearbeiten-Schritt, gebaut aus dem Referenzmemo.
const beispielMemo = () => {
  const h = MEMO_EXAMPLE.html;
  const b = MEMO_EXAMPLE.images;
  return {
    ...Object.fromEntries(Object.entries(h).filter(([k]) => !/^(kpi|bm|pot)\d/.test(k) && k !== "sources")),
    kpis: [1, 2, 3, 4].map((i) => ({ value: h[`kpi${i}_value`], label: h[`kpi${i}_label`], source: h[`kpi${i}_source`] })),
    benchmarks: [1, 2, 3].map((i) => ({ name: h[`bm${i}_name`], title: h[`bm${i}_title`], text: h[`bm${i}_text`], tag: h[`bm${i}_tag`], image: { ...b[`benchmarks.${i - 1}`], fit: "contain" } })),
    potentials: [1, 2, 3].map((i) => ({ label: h[`pot${i}_label`], title: h[`pot${i}_title`], finding: h[`pot${i}_finding`], potential: h[`pot${i}_potential`], image: b[`potentials.${i - 1}`] })),
    cover: b.cover, insight: b.insight, quote_portrait: b.quote_portrait, contact_portrait: b.contact_portrait,
    sources: String(h.sources || "").split(" · "),
    ...(window.hinweise ? { pruefhinweise: window.hinweise } : {}),
  };
};
const signal = { headline_de:"Handel baut Eigenmarken aus", why_de:"Anteil steigt.", company:"Testfirma AG",
  signal_label:"Markenstrategie", signal_id:"marken_strategie", roots_offering:"Markenstrategie", topics:["marken_strategie"],
  article:{ title_de:"Handel baut Eigenmarken aus", id:"00000000-0000-0000-0000-000000000001" } };
window.tone = "Kurze Sätze.";
window.vorlagen = [];
const callApi = async (a, payload) => {
  if (a === "list_assets") return { assets: [] };
  // Ein Lauf, der zweimal "laeuft" meldet und dann scheitert: prueft, dass das
  // Studio den Fehler zeigt statt eines stehenden Ladebalkens.
  if (a === "generate_asset") { window.laufAbrufe = 0; return { asset: { id: "lauf-1", status: "running", stage: "recherchieren", run_log: [], created_at: new Date().toISOString() } }; }
  if (a === "get_asset" && payload.asset_id === "lauf-1") {
    window.laufAbrufe = (window.laufAbrufe || 0) + 1;
    if (window.laufAbrufe < 3) return { asset: { id: "lauf-1", status: "running", stage: "pruefen", created_at: new Date().toISOString(), run_log: [{ t: 1000, event: "finish_start" }] } };
    return { asset: { id: "lauf-1", status: "error", error_message: window.laufFehler || "Das Cover wiederholt die Signalüberschrift. title muss die Herausforderung nennen, nicht die Nachricht.\n---\n{\"title\":\"Wie Ankerkraut Marke und Kanalrollen neu ordnet\"}" } };
  }
  if (a === "get_asset") return { asset: { id: payload.asset_id, status: "done", answers: {}, payload: beispielMemo(), edited_html: window.gespeichert || "" } };
  if (a === "save_asset") { window.gespeichert = payload.edited_html; return { ok: true, asset: { id: payload.asset_id } }; }
  if (a === "list_known_companies") return { companies: [
    { name: "Penny", aliases: ["Penny"], tier1: true, has_profile: true },
    { name: "Danone", aliases: ["Danone", "Alpro", "Volvic"], tier1: true, has_profile: true },
    { name: "Rossmann", aliases: ["Rossmann"], tier1: true, has_profile: false },
    { name: "dm", aliases: ["dm", "dm-drogerie markt"], tier1: true, has_profile: false },
  ] };
  if (a === "list_offerings") return { offerings: [
    { label: "Markenstrategie", pillar: "planning", active: true },
    { label: "Markenpositionierung", pillar: "purpose", active: true },
    { label: "Content-Strategie", pillar: "presence", active: true },
    { label: "D2P & Artwork Management", pillar: "productivity", active: true },
  ] };
  if (a === "draft_memo_section") { window.letzterAbschnitt = payload; return { section: payload.section, fields: window.abschnittFelder || {} }; }
  if (a === "sharpen_memo_field") { window.letztesFeld = payload; return { key: payload.key, text: window.feldVorschlag || `Geschärft: ${payload.value}` }; }
  if (a === "get_asset_tone") return { tone_of_voice: window.tone };
  if (a === "get_asset_design_templates") return { design_templates: window.vorlagen };
  if (a === "create_manual_signal") { window.letztesSignal = payload; return { article_id: "00000000-0000-0000-0000-000000000001", signal }; }
  if (a === "save_manual_signal_draft") { window.entwuerfe = window.entwuerfe || []; const id = payload.draft_id || ("e" + (window.entwuerfe.length + 1));
    const i = window.entwuerfe.findIndex(x => x.id === id);
    const zeile = { id, answers: payload.answers, step_key: payload.step_key, lane: payload.lane, headline: payload.answers?.headline || "", updated_at: new Date().toISOString() };
    if (i >= 0) window.entwuerfe[i] = zeile; else window.entwuerfe.push(zeile);
    window.letzterEntwurf = zeile; return { draft_id: id }; }
  if (a === "list_manual_signal_drafts") return { drafts: window.entwuerfe || [] };
  if (a === "delete_manual_signal_draft") { window.entwuerfe = (window.entwuerfe || []).filter(x => x.id !== payload.draft_id); return { ok: true }; }
  if (a === "draft_manual_signal_from_url") {
    window.letzteQuelle = payload;
    if (window.quelleLeer) return { source: { ok:false, grund:"Kein Weg hat ein Transkript hergegeben: kein Untertitel über den Player, keinen über die Seite, kein Spiegel erreichbar, kein Ergebnis über Apify." }, draft: null };
    return { source: window.quelleGemischt
      ? { ok:true, art:"mixed", plattform:"beispiel.de", zeichen:6120, weg:"Transkript über Apify",
          teile:["Artikeltext (2.480 Zeichen)","Transkript des eingebetteten Videos (3.640 Zeichen)"],
          grund:"Über Apify gelesen, das kostet wenige Cent je Video." }
      : { ok:true, art:"transcript", plattform:"youtube", zeichen:4820, weg:"Untertitel über den Player", grund:"" },
      draft: {
      felder: { headline:"Handel baut Eigenmarken schneller aus als geplant",
        core:"Der Eigenmarkenanteil steigt seit zwei Jahren schneller als von den Herstellern erwartet.",
        evidence:"Der Anteil liegt bei 41 Prozent, 2024 waren es 34 Prozent.",
        source:"Podcast Handelsblick, Folge 212", company:"", offering:"", territory:"DACH, Lebensmittelhandel",
        occasion:"", competitor:"" },
      missing: ["company","offering","occasion","competitor"], verdict:"duenn",
      verdictReason:"Kern und eine Zahl stehen, das Unternehmen nennt die Quelle nicht." } };
  }
  if (a === "check_manual_signal") {
    window.letztePruefung = payload;
    if (window.pruefBlocker) return { source_checked: true, source_error: "", check: {
      verdict:"untauglich", verdictReason:"Eine Zahl im Beleg steht nicht in der Quelle.",
      findings: [{ field:"evidence", severity:"blocker", note:"Die 68 Prozent kommen in der Quelle nicht vor." },
        { field:"occasion", severity:"info", note:"Anlass fehlt, das Signal trägt auch ohne." }],
      missing: ["company"], unsupported: ["evidence"], blocker:true, ready:false } };
    return { source_checked: true, source_error: "", check: {
      verdict:"tragfaehig", verdictReason:"Zahl und Kern stehen in der Quelle.",
      findings: [], missing: [], unsupported: [], blocker:false, ready:true } };
  }
  throw new Error("stub " + a);
};
window.oeffne = (kind="linkedin") => { closeAssetStudio(); openAssetStudio({ kind, articleId:"00000000-0000-0000-0000-000000000001", signal, callApi, openSettingsPanel:(p)=>{window.panel=p;} }); };
window.oeffneMemo = () => { closeAssetStudio(); openAssetStudio({ kind: "memo", assetId: "demo-memo", signal, callApi, openSettingsPanel:(p)=>{window.panel=p;} }); };
document.getElementById("li").onclick = () => window.oeffne("linkedin");
document.getElementById("me").onclick = () => window.oeffne("memo");
document.getElementById("ms").onclick = () => openManualSignal({ callApi, openSettingsPanel:(p)=>{window.panel=p;} });
window.zustand = () => {
  const ov = document.querySelector("#as-overlay");
  return JSON.stringify({
    offen: ov?.querySelector(".as-step--open .as-step-kopf label")?.textContent || null,
    fortschritt: ov?.querySelector(".as-progress-text")?.textContent || null,
    notice: ov?.querySelector(".as-notice b")?.textContent || null,
    nav: ov?.querySelector(".as-prev-nav span")?.textContent || null,
    stage: ov?.querySelector("[data-livepreview] .li")?.className || null,
    befund: [...(ov?.querySelectorAll(".as-step--open .lg-guide-row span") || [])].map((z) => z.textContent),
    knoepfe: [...(ov?.querySelectorAll(".as-step--open .as-step-fuss button") || [])].map((b) => b.textContent.trim()),
  });
};
</script></body></html>
